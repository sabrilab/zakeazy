# ADN visuel de Zak Eazy — version 0.3 (calée sur « La Maison Verte », retours de Zak du 2026-11-05)
# Construit à partir des interviews publiques (2020-2025). Chaque valeur
# chiffrée est une HYPOTHÈSE de départ à recaler sur le corpus Instagram
# (voir `zak corpus`), puis à valider avec Zak lui-même.

artiste: Zak Eazy
devise: "La tête dans les nuages, les pieds sur terre"

themes:
  sujets_principaux:
    - architecture et monuments reconnaissables (beffroi de Lille, Vieille Bourse, Opéra, Burj Al Arab, Dubai Frame, Tour Eiffel, Taj Mahal...)
    - nature (mer, falaises, végétation tropicale, nuages, couchers de soleil)
    - animaux déplacés (orques, dauphins, pieuvre géante, flamants roses)
  mecaniques_surrealistes:
    - deplacement: "un monument familier transporté dans un paysage lointain (beffroi sur le rocher de Khao Phing Kan)"
    - immersion: "la ville envahie par l'eau ou la jungle, la faune marine nage entre les bâtiments"
    - elevation: "monument posé sur un nuage ou flottant dans le ciel"
    - echelle: "animal ou objet à une échelle impossible (pieuvre enlaçant la Chambre de Commerce)"
    - cadre: "un élément sert de fenêtre entre deux mondes (Dubai Frame : ancien / nouveau Dubaï)"
    - metamorphose: "un objet du quotidien se transforme (panier de basket en nuage de fleurs)"
  intention: "Faire voir le quotidien sous un autre angle ; provoquer curiosité et questionnement ; lecture ouverte, du féerique à l'apocalyptique."
  influences: [Salvador Dalí, Hayao Miyazaki (palette), Julien Tabet, Dragon Ball Z (Kaio), publicité, voyages]

colorimetrie:
  dominante: "pastel DÉSATURÉ et aérien, à mi-chemin entre une photo naturelle et un rêve : ciel menthe / bleu-vert très pâle, air laiteux, avant-plan terreux et chaud. La douceur vient de l'air et de la lumière diffuse, pas d'un filtre rose."
  reference_absolue: "« La Maison Verte (The Green House) », Zak Eazy : maison haussmannienne penchée, portée par un arbre sur un rocher, montagnes brumeuses, petites montgolfières pâles au loin. Zak : « c'est vraiment un équilibre de ouf »."
  historique_retours:
    - "2026-11-05 matin : trop « vaporwave » (rose, lavande, pêche, coucher de soleil partout)."
    - "2026-11-05 après-midi : la version corrigée trop naturelle (ciel bleu franc, contraste photo) va trop loin dans l'autre sens. Il faut « la jauge parfaite entre les 2 » = La Maison Verte."
  a_eviter:
    - dominante rose / violet / lavande / pêche
    - coucher de soleil systématique, néon, synthwave
    - ciel bleu saturé et contraste de photo brute (trop « naturel »)
  a_viser:
    - ciel menthe pâle presque blanc vers l'horizon, nuages blancs légers et diffus
    - lumière de jour diffuse, douce, ombres légères
    - lointains noyés dans une brume claire bleu-vert (perspective atmosphérique forte)
    - avant-plan minéral chaud et désaturé (roche, terre), seul endroit vraiment sombre
    - saturation globale basse, touches de vert végétal discrètes
  palette_reference:          # mesurée sur « La Maison Verte » (capture Instagram)
    ciel_haut:   "#D9EDED"
    ciel_bas:    "#F0F2F0"
    nuage:       "#E9F1F0"
    soleil:      "#F7F8F2"
    eau:         "#9CC5C2"
    lointains:   "#96B0B1"
    ombre:       "#5B5048"     # ombres chaudes et terreuses à l'avant-plan
    vegetation:  "#8FA67C"
    pierre:      "#93847A"
  etalonnage:
    noir_releve: 0.05
    blanc_max: 0.97
    saturation: 0.78           # nettement désaturé
    teinte_ombres: "#5E7A7A"   # ombres vers le bleu-vert gris
    teinte_lumieres: "#EEF5EC" # lumières vers un blanc menthe
    force_split: 0.10

lumiere_et_ombres:
  principe: "Surréaliste dans l'idée, réaliste dans le détail : grand soin des ombres des animaux et des rayons du soleil."
  regles:
    - une seule source principale (le soleil, à des heures variées) ; direction cohérente pour TOUS les éléments
    - ombre portée = projection sur le plan du sol, longueur liée à la hauteur du soleil
    - pénombre qui s'élargit avec la distance au point de contact
    - ombre de contact dense et courte sous chaque appui (pattes, base des bâtiments)
    - couleur d'ombre = couleur du ciel assombrie, sans teinte violette ajoutée, mode Produit (multiply)
    - sur l'eau : reflet inversé, ondulé, atténué, plutôt qu'une ombre dure
    - light wrap : les bords des éléments prennent la lumière du décor
    - rayons de soleil volumétriques en mode Superposition/Écran
  defauts:
    elevation_soleil_deg: 25
    inclinaison_sol: 0.45      # écrasement perspective du plan du sol
    opacite_ombre_portee: 0.55
    opacite_ombre_contact: 0.85

composition:
  - une image source forte (« LA photo ») dicte perspective, angle et horizon ; le monde est construit autour
  - monument comme point focal, souvent centré ou sur un tiers, vu en contre-plongée légère
  - horizon bas, grand ciel qui porte l'ambiance
  - profondeur par perspective atmosphérique forte (lointains noyés dans une brume claire bleu-vert)
  - formats Instagram : 4:5 portrait (1080x1350) en priorité

matieres_et_textures:
  - pierre et façades photographiques réelles (Lille : brique, pierre sculptée flamande)
  - eau lisse et miroitante, écume légère
  - nuages volumineux et cotonneux
  - végétation tropicale dense
  - peau lisse et brillante des mammifères marins
  - grain fin et unifié sur toute l'image pour fondre les sources

processus:
  temps_par_oeuvre_heures: [7, 20]
  demarrage: "80 % intuition (une photo inspire, il ouvre Photoshop), 20 % idée précise issue d'un carnet de 50+ idées"
  etape_la_plus_longue: "trouver les bonnes images et les bons points de vue (banques libres, photographes amis, ses propres photos)"
